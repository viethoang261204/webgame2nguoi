services:
  - type: web
    name: webgame2nguoi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # khóa mã hóa trạng thái phòng, Render tự sinh 1 lần và giữ nguyên qua các lần deploy
      - key: SECRET
        generateValue: true
