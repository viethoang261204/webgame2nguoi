<!doctype html>
<html lang="vi" data-theme="arena">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#090b16">
  <title>Game Cùng Bạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/app.css">
</head>
<body class="app-bg min-h-dvh">
  <div class="mx-auto flex min-h-dvh max-w-6xl flex-col px-3 pb-[max(12px,env(safe-area-inset-bottom))] pt-[env(safe-area-inset-top)] sm:px-5">
    <header class="flex items-center gap-2 py-3">
      <a href="/" class="btn btn-square btn-ghost btn-sm" aria-label="Trang chủ"><i data-lucide="arrow-left"></i></a>
      <div class="min-w-0 flex-1">
        <h1 id="gTitle" class="truncate text-base font-bold leading-tight sm:text-lg"></h1>
        <p id="gSub" class="truncate text-xs text-neutral-content/60"></p>
      </div>
      <button id="roomChip" class="kbd-code hidden" title="Copy link phòng"></button>
      <button class="btn btn-square btn-ghost btn-sm" id="rulesBtn" aria-label="Luật chơi"><i data-lucide="book-open"></i></button>
    </header>

    <!-- Màn tạo / vào phòng -->
    <main id="setup" class="hidden flex-1 py-4">
      <div class="mx-auto w-full max-w-md">
        <div class="panel overflow-hidden">
          <img id="setupThumb" alt="" class="aspect-[16/9] w-full object-cover opacity-90">
          <div class="flex flex-col gap-4 p-5">
            <div>
              <h2 id="setupTitle" class="text-2xl font-extrabold tracking-tight"></h2>
              <p id="setupDesc" class="mt-1 text-sm text-neutral-content/70"></p>
            </div>
            <div id="settingsForm" class="flex flex-col gap-3"></div>
            <label class="form-control">
              <div class="label py-1"><span class="label-text text-neutral-content/80">Tên hiển thị</span></div>
              <input id="nameInput" maxlength="24" class="input input-bordered" autocomplete="off">
            </label>
            <div class="grid gap-2">
              <button id="createOnline" class="btn btn-primary"><i data-lucide="link"></i> Tạo phòng online</button>
              <button id="createLocal" class="btn btn-outline"><i data-lucide="smartphone"></i> Hai người trên cùng máy</button>
            </div>
            <div class="divider my-0 text-xs text-neutral-content/50">hoặc vào phòng có sẵn</div>
            <div class="join w-full">
              <input id="joinInput" class="input join-item input-bordered w-full" placeholder="Mã phòng hoặc link" autocapitalize="off" autocomplete="off" spellcheck="false">
              <button id="joinBtn" class="btn join-item btn-neutral"><i data-lucide="log-in"></i> Vào</button>
            </div>
            <p id="setupErr" class="min-h-5 text-center text-sm text-error"></p>
          </div>
        </div>
      </div>
    </main>

    <!-- Màn chơi -->
    <main id="game" class="hidden flex-1 gap-5 lg:grid lg:grid-cols-[minmax(0,1fr)_340px]">
      <section class="flex min-w-0 flex-col gap-2">
        <div id="pTop" class="player"></div>
        <div id="boardWrap" class="relative grid place-items-center">
          <div id="board" class="relative"></div>
          <div id="waiting" class="absolute inset-0 z-20 hidden place-items-center p-3">
            <div class="panel w-full max-w-sm p-5 text-center shadow-2xl">
              <div class="mx-auto mb-3 w-fit rounded-xl bg-white p-2"><div id="qr"></div></div>
              <h3 class="text-lg font-bold">Mời bạn vào phòng</h3>
              <p class="mb-3 text-sm text-neutral-content/70">Gửi link hoặc quét mã QR. Đối thủ vào là bắt đầu ngay.</p>
              <div class="join w-full">
                <input id="shareLink" class="input join-item input-bordered input-sm w-full font-mono text-xs" readonly>
                <button class="btn join-item btn-primary btn-sm" data-copy><i data-lucide="copy"></i></button>
                <button class="btn join-item btn-sm hidden" data-share><i data-lucide="share-2"></i></button>
              </div>
            </div>
          </div>
        </div>
        <div id="pBottom" class="player"></div>
      </section>

      <aside class="mt-3 flex flex-col gap-3 lg:mt-0">
        <div id="status" class="panel p-4"></div>
        <div id="controls" class="empty:hidden"></div>
        <div class="panel grid grid-cols-3 gap-2 p-2">
          <button id="drawBtn" class="btn btn-ghost btn-sm flex-col gap-0.5 py-1 font-medium h-auto min-h-12"><i data-lucide="handshake"></i><span class="text-[11px]">Xin hòa</span></button>
          <button id="resignBtn" class="btn btn-ghost btn-sm flex-col gap-0.5 py-1 font-medium h-auto min-h-12"><i data-lucide="flag"></i><span class="text-[11px]">Đầu hàng</span></button>
          <button id="rematchBtn" class="btn btn-ghost btn-sm flex-col gap-0.5 py-1 font-medium h-auto min-h-12"><i data-lucide="rotate-ccw"></i><span class="text-[11px]">Ván mới</span></button>
        </div>
        <div id="side" class="empty:hidden"></div>
      </aside>
    </main>
  </div>

  <dialog id="resultDlg" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box border border-white/10 bg-base-100 text-center">
      <div id="resIcon" class="mx-auto mb-3 grid h-16 w-16 place-items-center rounded-2xl"></div>
      <h3 id="resTitle" class="text-2xl font-extrabold"></h3>
      <p id="resReason" class="mt-1 text-neutral-content/70"></p>
      <div id="resScore" class="mt-4 flex items-center justify-center gap-4"></div>
      <div class="modal-action justify-center gap-2">
        <form method="dialog"><button class="btn btn-ghost">Xem lại bàn</button></form>
        <button id="resRematch" class="btn btn-primary"><i data-lucide="rotate-ccw"></i> Ván mới</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <dialog id="rulesDlg" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box border border-white/10 bg-base-100">
      <h3 class="flex items-center gap-2 text-lg font-bold"><i data-lucide="book-open"></i> Luật chơi <span id="rulesName" class="text-primary"></span></h3>
      <ol id="rulesList" class="mt-3 list-decimal space-y-2 pl-5 text-sm leading-relaxed text-neutral-content/90"></ol>
      <div class="modal-action"><form method="dialog"><button class="btn">Đã hiểu</button></form></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <div id="toasts" class="toast toast-center toast-top z-50"></div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/shared/play.js"></script>
</body>
</html>
