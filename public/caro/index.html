<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#090b16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Caro Vô Hạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>

  <!-- MENU -->
  <div id="menu" class="screen">
    <div class="card">
      <a class="home-link" href="/"><i data-lucide="arrow-left"></i> Trang chủ</a>
      <div class="logo">
        <div class="logo-grid">
          <i class="lx">✕</i><i></i><i class="lo">○</i>
          <i></i><i class="lx">✕</i><i></i>
          <i class="lo">○</i><i></i><i class="lx">✕</i>
        </div>
      </div>
      <h1>Caro <span>Vô Hạn</span></h1>
      <p class="sub">Bàn cờ không giới hạn · không cần tài khoản</p>

      <div class="field">
        <span><i data-lucide="target"></i> Thắng khi đủ</span>
        <div class="seg" id="winLen">
          <button data-v="3">3</button>
          <button data-v="4">4</button>
          <button data-v="5" class="on">5</button>
          <button data-v="6">6</button>
        </div>
      </div>

      <div class="modes">
        <button class="mode featured" data-mode="online">
          <div class="mode-ic"><i data-lucide="globe"></i></div>
          <div class="mode-tx"><b>Chơi online</b><span>Tạo phòng &amp; gửi link cho bạn</span></div>
          <i data-lucide="chevron-right" class="chev"></i>
        </button>
        <button class="mode" data-mode="bot">
          <div class="mode-ic bot"><i data-lucide="bot"></i></div>
          <div class="mode-tx"><b>Đấu với máy</b><span>Luyện tay với AI</span></div>
          <i data-lucide="chevron-right" class="chev"></i>
        </button>
        <button class="mode" data-mode="local">
          <div class="mode-ic local"><i data-lucide="users"></i></div>
          <div class="mode-tx"><b>2 người 1 máy</b><span>Chuyền tay nhau đánh</span></div>
          <i data-lucide="chevron-right" class="chev"></i>
        </button>
      </div>

      <div class="divider"><span>hoặc vào phòng có sẵn</span></div>
      <div class="join">
        <input id="roomInput" placeholder="Mã phòng hoặc link..." autocapitalize="off" autocomplete="off" spellcheck="false">
        <button class="btn primary sq" id="joinBtn" aria-label="Vào phòng"><i data-lucide="log-in"></i></button>
      </div>
      <p id="menuErr" class="err"></p>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" class="screen hidden">
    <canvas id="board"></canvas>

    <div class="topbar">
      <button class="icon glass" id="backBtn" aria-label="Menu"><i data-lucide="arrow-left"></i></button>
      <div id="status" class="glass">...</div>
      <div id="score" class="glass"></div>
    </div>

    <div id="share" class="share glass hidden">
      <div class="share-head"><span class="dot-live"></span> Đang chờ đối thủ... gửi link này:</div>
      <div class="share-row">
        <input id="shareLink" readonly>
        <button class="btn sq" id="copyBtn" aria-label="Copy"><i data-lucide="copy"></i></button>
        <button class="btn primary sq hidden" id="nativeShareBtn" aria-label="Chia sẻ"><i data-lucide="share-2"></i></button>
      </div>
    </div>

    <div class="bottombar">
      <div class="dock glass">
        <button class="tool" id="centerBtn"><i data-lucide="crosshair"></i><span>Về giữa</span></button>
        <button class="tool" id="confirmBtn"><i data-lucide="pointer"></i><span>Chạm 2 lần</span></button>
        <button class="tool" id="undoBtn"><i data-lucide="undo-2"></i><span>Đi lại</span></button>
        <button class="tool primary" id="rematchBtn"><i data-lucide="rotate-ccw"></i><span>Ván mới</span></button>
      </div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card glass">
        <div class="modal-emoji" id="modalEmoji"><i data-lucide="trophy"></i></div>
        <h2 id="modalTitle">Bạn thắng!</h2>
        <p id="modalSub"></p>
        <div class="modal-actions">
          <button class="btn" id="viewBtn"><i data-lucide="eye"></i> Xem bàn</button>
          <button class="btn primary" id="modalRematch"><i data-lucide="rotate-ccw"></i> Ván mới</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast glass hidden"></div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
